# To alternative Traefik-middlewares, begge definert her (docker-provideren, ikke
# den delte middlewares.yml-plattform-SPOF-en — se integrasjoner/dokploy). Kun ÉN
# refereres om gangen i Dokploys Domains-fane, feltet "Middlewares":
#
#   forskningssok-auth@docker         — Basic Auth, delt statisk credential.
#     Passordet er IKKE i denne fila (kun hashen) — gitt til Anders direkte, aldri
#     skrevet til fil/commit/minne (se feedback_hemmeligheter-er-midlertidige).
#     Fungerer for ALLE som har credentialet, uten portal-konto.
#
#   forskningssok-forwardauth@docker  — ekte portal-SSO (2026-09-04). Traefik
#     spør /api/auth/forward FØR proxy — samme endepunkt ADR-042 bruker for
#     wiki-instanser (get_current_user leser den delte .lauvasdata.no-cookien,
#     forward_auth() sjekker app_access mot X-Forwarded-Host). Ingen credentials
#     noensinne for en innlogget, grantet bruker (Anders ELLER en scopet Ulven
#     med app_access="forskningssok"). trustForwardHeader er BEVISST utelatt —
#     Traefiks default beregner X-Forwarded-Host fra selve ruter-treffet
#     (forskningssok.lauvasdata.no), setter det aldri klienten selv sende inn.
#     ⚠ Krever en ekte portal-konto — Ulvens Basic Auth-lenke slutter å virke for
#     ham til invitasjonen faktisk er fullført.
#
#     ⚠ address peker INTERNT (lauvasdata-portal-xaxnqv-backend-1), ALDRI mot
#     api.lauvasdata.no. Dette er en KJENT felle (konsepter/kjente-feller §Auth/
#     ForwardAuth, 2026-06-22): peker address mot det offentlige domenet, ruter
#     Traefik forespørselen gjennom SEG SELV på nytt — det andre hoppet
#     overskriver X-Forwarded-Host til api.lauvasdata.no (sitt eget domene) FØR
#     forward_auth() ser den, som da ikke finner noen app og svarer 403 «Ukjent
#     app-host» (rammet oss live 2026-09-04, samme feilmelding som i 2026-06-22-
#     hendelsen). Internadressen har ETT hopp — X-Forwarded-Host forblir riktig.
#     Restrisiko (samme som den opprinnelige fiksen dokumenterte): containernavnet
#     bærer et Dokploy-generert suffiks («xaxnqv») som KAN endre seg ved en full
#     gjenskaping av lauvasdata-portal-appen — sjekk `docker ps | grep backend`
#     på nytt hvis ForwardAuth plutselig gir 403 «Ukjent app-host» igjen.
services:
  forskningssok:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.forskningssok-auth.basicauth.users=ulven:$$apr1$$7O6jJI49$$Fg55OoIABGWc3bH3sOIiV0"
      - "traefik.http.middlewares.forskningssok-forwardauth.forwardauth.address=http://lauvasdata-portal-xaxnqv-backend-1:8000/api/auth/forward"
    environment:
      # Volum-sti — se paths.py for hvorfor ALLE fire cache-moduler må dele denne
      # (ellers "halvveis persistert" cache som mister deler av dataen ved redeploy).
      FORSKNINGSSOK_DB: ${FORSKNINGSSOK_DB:-/data/cache.db}
      # Satt = ai-proxy/embed (mistral-embed, EU-direkte, dokploy-network-internt).
      # Usatt = ville falt til lokal Ollama (uoppnåelig herfra) — MÅ stå her i prod.
      # Se bank.py sin moduldocstring for hele resonnementet.
      AI_PROXY_URL: ${AI_PROXY_URL:-http://ai-proxy:8000}
      # Fagfeltet (profiler/*.toml, se README §Domeneprofilen som datafil). Usatt =
      # «fiskehelse», som ligger i imaget — altså uendret oppførsel for denne instansen.
      # Settes den til en sti, MÅ fila være i imaget eller på et montert volum: profilen
      # lastes ved IMPORT, så en profil som ikke finnes stopper oppstarten (med vilje —
      # stille tomme termlister ville sett ut som «ingen treff i dette fagfeltet»).
      FORSKNINGSSOK_PROFIL: ${FORSKNINGSSOK_PROFIL:-fiskehelse}
      # GlitchTip-DSN. Tom = feilsporing AV, og appen starter helt normalt — den skal
      # aldri kunne velte oppstarten fordi en observasjonstjeneste mangler.
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      AI_PROXY_WIKI_ID: ${AI_PROXY_WIKI_ID:-forskningssok}
    volumes:
      - forskningssok_data:/data
    networks:
      - dokploy-network

volumes:
  forskningssok_data:

networks:
  dokploy-network:
    external: true
