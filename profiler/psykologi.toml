Denne profilen samler forskning om psykisk helse, helsefremming, forebygging og
psykososiale forhold. [fag] viser til et gjenkjent fagmiljø eller tidsskrift.
[tema?] betyr at artikkelens tittel/abstract ikke inneholder profilens måltermer;
fravær av treff er ikke bevis på manglende relevans. Temaer og akser er
nøkkelordssignaler for videre lesing, ikke kvalitetsvurderinger eller kliniske råd.
"""

