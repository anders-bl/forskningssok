# Domeneprofil: norsk oppdrettslaks-patologi (Ulvens fagfelt, idébank #28/#29).
#
# DETTE er den eneste fila som skal endres for å peke verktøyet mot et annet fagfelt.
# Ingen Python-modul skal lenger bære et fagfelt-spesifikt ord — verifisert av
# tests/test_domeneprofil_generisk.py, som laster en HELT annen profil og sjekker at
# ingen fiske-term lekker gjennom.
#
# Velg profil med FORSKNINGSSOK_PROFIL: enten et navn her i profiler/ («fiskehelse»)
# eller en absolutt sti til en .toml utenfor repoet. Samme mønster som paths.py bruker
# for FORSKNINGSSOK_DB.

navn = "Fiskehelse — norsk lakseoppdrett"
# Brukes i «Om»-panelets første avsnitt. Én linje, ikke en avhandling.
kort = "norsk oppdrettslaks-patologi (nyre/lever/ultralyd-validering)"
# Søkefeltets standardverdi ved sidelast, og eksempelet i placeholderen.
sok_standard = "nephrocalcinosis salmon"
sok_eksempel = "nephrocalcinosis smolt seawater transfer"
# Valgfritt (i motsetning til sok_standard): eget søkespor for AVBILDNINGSUTSTYRET selv,
# ikke fiskehelsen det brukes på. dossier.py (2026-09-10) slår dette sammen med
# emne-treffet i SAMME cache, slik at et dossier om f.eks. øye-skanning kan trekke på
# både biologi-litteratur og maskinvare/metode-litteratur samtidig. Domeneprofil.py
# validerer den IKKE som påkrevd — et fagfelt uten eget utstyrsspor lar bare feltet stå
# tomt, og dossier.py hopper stille over utvidelsen.
sok_utstyr = "aquaculture fish imaging ultrasound X-ray computer vision sensor"
# Valgfritt: hvilken del av bok-banken (bøker/boker.db) som hører til dette fagfeltet, som
# proveniens-prefikser. bank_utdrag.py eksporterer akkurat disse til prod-utdraget som
# syntese-laget bruker som BAKGRUNN. «epmc:» er Europe PMC OA-artikler (verifisert CC BY),
# «core:fiskehelse» de CORE-verkene som passerte lisensgaten i fold_op.py. Tom/mangler =
# ingen bank-bakgrunn for dette fagfeltet.
bank_proveniens = ["epmc:", "core:fiskehelse"]

[domene]
# Domene-nærhet matches mot forfatter-affiliasjon + tidsskriftnavn — de to strengene
# Europe PMC allerede returnerer, så dette koster ingen ny henting. Se ranking.py:domene_naer.
merke = "[fag]"
merke_betyr = "norsk fagmiljø/fagtidsskrift"
fagmiljoer = [
  "havforskningsinstitutt", "veterinærinstitutt", "veterinaerinstitutt",
  "nmbu", "norwegian university of life sciences", "nofima", "pharmaq",
  # NTNU og UiB/Bergen manglet. Funnet 2026-09-04 ved korpus-måling: CORE-treff bærer
  # ARKIVNAVNET i tidsskrift-feltet («NTNU Open», «Bergen Open Research Archive»), og
  # begge er ekte norske marin-/oppdrettsmiljøer på linje med de fire over — Havforsknings-
  # instituttet ligger i Bergen, NTNU har tung marin forskning. De er lagt til fordi de
  # HØRER hjemme i lista, ikke fordi de løftet et tall.
  "ntnu", "norwegian university of science and technology", "bergen",
  # UiT manglet — ULVEN_README.md lovet henne "UiT Munin (arktisk fiskehelse)" som
  # prioritert kilde, men ordet fantes ikke her, så et ekte Munin-treff fikk aldri
  # [fag]-merket. Funnet 2026-09-10 ved korpus-måling (samme metode som NTNU/Bergen
  # over): et allerede cachet papir har tidsskrift="Munin - Open Research Archive,
  # NORA - Norwegian Open Research Archives". Trygt som bart substreng — domene_naer()
  # matcher KUN forfattere+tidsskrift (ranking.py), aldri tittel/abstract, så et papir
  # om det USLEKTEDE "Munin"-dataprogrammet (Carter/Bennett/Zwaenepoel 1991) ikke
  # treffer her uansett. Et treff uten fiskeart i abstractet får likevel [art?] av
  # arts_naer_tekst — de to aksene er uavhengige med vilje, se domeneprofil.py.
  "munin",
]
fagtidsskrifter = [
  "journal of fish diseases", "aquaculture", "diseases of aquatic organisms",
  "journal of fish biology", "fish and shellfish immunology",
]

[art]
# «Art» er profilens navn på MÅLOBJEKTET — arten i fiskehelse, men like gjerne
# populasjonen, materialet eller systemet i et annet fagfelt. Signalet er FRAVÆR/NÆRVÆR,
# aldri en klassifikator: et papir uten treff blir flagget, ALDRI filtrert bort.
merke = "[art?]"
merke_betyr = "nevner ikke laks/oppdrettsfisk i tittel/abstract"
merke_utdypet = "kan være en annen art (f.eks. humanmedisin)"
termer = [
  "salmon", "salmo salar", "laks", "smolt", "post-smolt", "salmonid", "salmonids",
  "atlantic salmon", "trout", "ørret", "aquaculture", "oppdrett", "teleost", "finfish",
  "farmed fish", "fish",
]
# Fraser som inneholder en artsterm uten å handle om arten. Fjernes FØR substreng-sjekken
# — en ordgrense-regex ville uansett matchet «salmon» inni «salmon calcitonin».
# «salmon calcitonin» er et vanlig LEGEMIDDELNAVN i kalsium-/nyrestein-litteratur
# (kalsitonin ble opprinnelig isolert fra laks), altså en systematisk falsk-positiv
# kollisjon i NETTOPP dette domenet. Fanget live 2026-09-02 på et ekte pediatrisk
# case-serie-funn om CYP24A1-mutasjoner.
# «salmon arm» er et STEDSNAVN (by i British Columbia) — samme homonym-klasse som
# legemiddelnavnet over, funnet ved korpus-inspeksjon 2026-09-04: «A Salmon Arm scrapbook»
# lå i cachen med arts_naer=True og ble båndet OPP over ekte fiskehelse-papirer.
kollisjoner = ["salmon calcitonin", "salmon arm", "salmonella"]
# MeSH-descriptorer som betyr «dette handler om målobjektet». Valgt fra NLMs vokabular
# 2026-09-04, FØR måling og uten å se på hvilke cachede papirer som bærer hvilke —
# ellers ville lista vært tilpasset svaret (forhåndsregistreringen sier hvorfor).
# «Animals» er bevisst UTELATT: den står på nesten alle dyrestudier, også humanmedisinske
# musemodeller, og ville gjort predikatet nesten alltid sant.
mesh_termer = [
  "Salmo salar", "Salmonidae", "Oncorhynchus", "Fishes", "Fish Diseases",
  "Aquaculture", "Fisheries", "Trout", "Salmon",
]

[art.niva]
# Nivåinndeling av «hva handler dette om»: maal > naer > annet > ingen. Erstatter ikke
# `termer` over (rangeringen bruker den fortsatt), men gir syntesen og bank-bakgrunnen et
# skille ja/nei-testen ikke kan: «fish» og «aquaculture» står i `termer`, så en sjøpølse-
# artikkel ble målt som artsnær (22 av 32 tittel-treff falske mot en håndlest fasit,
# 2026-09-25). Termene er skrevet FØR noen fasit ble sett; de justeres kun mot utviklings-
# delen av fasiten (tests/fixtures/art_fasit.json), aldri mot den tilbakeholdte delen.
#   maal   = målobjektet selv (laksefisk)
#   naer   = samme fagområde, annen/uspesifisert fisk eller akvakultur generelt
#   annet  = organismer utenfor fagområdet: skalldyr/bløtdyr og pattedyr/mennesker
# Treff er ordgrense-basert: korte termer (<5 tegn) må matche hele ordet, lengre matcher
# ordstart så «salmonid» og «trouts» treffer. Norske sammensetninger står oppført eksplisitt.
# MeSH-descriptorer som alene avgjør «maal» (de brede i `mesh_termer`, som «Fishes», gir bare «naer»).
