domeneprofil = """
Denne instansen er scopet til norsk lakseoppdrett — fagmiljøer (Havforskningsinstituttet,
Veterinærinstituttet, NMBU, Nofima, Pharmaq), fagtidsskrifter, og artstermer er alle
